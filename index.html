<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radha Krishna Divine Pro</title>
    <style>
        :root {
            --gold: #FFD700;
            --dark-bg: #1a0101;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: radial-gradient(circle, #3d0202 0%, #000000 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid var(--gold);
            background: rgba(0,0,0,0.5);
        }

        .header h1 { color: var(--gold); font-size: 24px; text-transform: uppercase; }

        .screen { display: none; padding: 20px; padding-bottom: 100px; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

        /* Menu Grid */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,215,0,0.2);
            padding: 25px 10px;
            border-radius: 20px;
            text-align: center;
        }

        /* Jap UI */
        .counter-circle {
            width: 200px; height: 200px;
            border: 5px solid var(--gold);
            border-radius: 50%;
            margin: 30px auto;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(255,215,0,0.4);
        }

        .btn-main {
            background: linear-gradient(45deg, #FF8C00, #FFD700);
            border: none; width: 100%; padding: 18px;
            border-radius: 50px; font-weight: bold; font-size: 18px;
            color: #000; cursor: pointer;
        }

        /* Banner Placeholder (Important for Ads) */
        #ad-banner-space {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #444;
            border-top: 1px solid var(--gold);
            z-index: 9999;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Divine Radha</h1>
    </div>

    <div class="screen active" id="mainMenu">
        <div class="menu-grid">
            <div class="card" onclick="showScreen('japScreen')"><span>📿</span><p>Start Jap</p></div>
            <div class="card" onclick="showScreen('bhajanScreen')"><span>🎵</span><p>Bhajans</p></div>
            <div class="card" onclick="showScreen('historyScreen')"><span>📊</span><p>History</p></div>
            <div class="card" onclick="showScreen('settingsScreen')"><span>⚙️</span><p>Settings</p></div>
        </div>
    </div>

    <div class="screen" id="japScreen">
        <button class="btn-main" onclick="showScreen('mainMenu')" style="background:none; color:var(--gold); border:1px solid var(--gold); margin-bottom:15px;">← BACK</button>
        <div class="counter-circle">
            <h2 id="displayCount" style="font-size: 50px;">0</h2>
            <p>Japs Done</p>
        </div>
        <button class="btn-main" onclick="handleJap()">PRESS TO JAP</button>
        <p style="text-align: center; margin-top: 20px; color: #888;">Target: 108</p>
    </div>

    <div class="screen" id="bhajanScreen">
        <button class="btn-main" onclick="showScreen('mainMenu')">← BACK</button>
        <p style="margin-top:20px; text-align:center;">Bhajan List Loading...</p>
    </div>

    <div class="screen" id="historyScreen">
        <button class="btn-main" onclick="showScreen('mainMenu')">← BACK</button>
        <div class="card" style="margin-top:20px;">
            <p>Total Life-Time Japs</p>
            <h1 id="totalHistory">0</h1>
        </div>
    </div>

    <div class="screen" id="settingsScreen">
        <button class="btn-main" onclick="showScreen('mainMenu')">← BACK</button>
        <div class="card" style="margin-top:20px;" onclick="resetData()">Reset App Data</div>
    </div>

    <div id="ad-banner-space">
        AD LOADING...
    </div>

    <script src="cordova.js"></script> <script>
        // AD CONFIGURATION
        const AD_IDS = {
            banner: 'ca-app-pub-6519206650027176/5330315933',
            interstitial: 'ca-app-pub-6519206650027176/7837770216'
        };

        let stats = JSON.parse(localStorage.getItem('radhaStats')) || { total: 0, today: 0 };

        // 1. Initialize Ads on Device Ready
        document.addEventListener('deviceready', () => {
            initBannerAd();
            prepareInterstitial();
        }, false);

        function initBannerAd() {
            if (window.admob) {
                admob.banner.show({ id: AD_IDS.banner });
            }
        }

        function prepareInterstitial() {
            if (window.admob) {
                admob.interstitial.load({ id: AD_IDS.interstitial });
            }
        }

        function showInterstitial() {
            if (window.admob) {
                admob.interstitial.show().then(() => {
                    prepareInterstitial(); // Load next one after showing
                });
            }
        }

        // 2. Jap Logic with Ad Trigger
        function handleJap() {
            stats.total++;
            stats.today++;
            
            document.getElementById('displayCount').innerText = stats.today;
            localStorage.setItem('radhaStats', JSON.stringify(stats));

            if (navigator.vibrate) navigator.vibrate(50);

            // Show Interstitial on every 108 counts (Mala Complete)
            if (stats.today % 108 === 0) {
                showInterstitial();
            }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('totalHistory').innerText = stats.total;
        }

        function resetData() {
            if(confirm("Clear everything?")) {
                stats = { total: 0, today: 0 };
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
