<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divine Jaap Pro</title>
    <style>
        :root { --primary-color: #FFD700; --bg-gradient: radial-gradient(circle, #333 0%, #000 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); color: white; min-height: 100vh; display: flex; flex-direction: column; transition: all 0.5s ease; overflow: hidden; }
        .header { padding: 15px; text-align: center; background: rgba(0,0,0,0.6); border-bottom: 2px solid var(--primary-color); position: relative; }
        .header h1 { color: var(--primary-color); font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .sound-toggle { position: absolute; right: 15px; top: 15px; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 10px; }
        .screen { display: none; padding: 20px; flex-grow: 1; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 400px; }
        .card { background: rgba(255,255,255,0.1); padding: 25px 10px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .counter-circle { width: 220px; height: 220px; border: 8px solid var(--primary-color); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 0 25px var(--primary-color); background: rgba(0,0,0,0.5); cursor: pointer; margin: 20px 0; }
        .count-num { font-size: 65px; font-weight: bold; }
        .btn-back { background: transparent; color: white; border: 1px solid white; padding: 10px 25px; border-radius: 50px; font-weight: bold; }
        .mantra-text { font-size: 18px; margin-bottom: 10px; font-style: italic; color: #ccc; text-align: center; min-height: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="appTitle">Divine Jaap Pro</h1>
        <div class="sound-toggle" onclick="toggleSound()" id="soundBtn">🔊</div>
    </div>

    <div class="screen active" id="mainMenu">
        <div class="menu-grid">
            <div class="card" onclick="selectDeity('radha')"><h2>🌸</h2><p>Radha Radha</p></div>
            <div class="card" onclick="selectDeity('ram')"><h2>🏹</h2><p>Jai Shree Ram</p></div>
            <div class="card" onclick="selectDeity('shiva')"><h2>🔱</h2><p>Om Namah Shivay</p></div>
            <div class="card" onclick="selectDeity('navkar')"><h2>🕉️</h2><p>Navkar Mantra</p></div>
        </div>
    </div>

    <div class="screen" id="japScreen">
        <p class="mantra-text" id="activeMantra">Mantra</p>
        <div class="counter-circle" onclick="handleJap()">
            <div class="count-num" id="displayCount">0</div>
            <p style="color: #bbb; font-size: 10px;">TAP</p>
        </div>
        <div id="malaDisplay" style="color:var(--primary-color); font-weight:bold; margin-bottom:20px;">Malas: 0</div>
        <button class="btn-back" onclick="goBack()">← MENU</button>
    </div>

    <script>
        let count = 0, malas = 0, isSoundOn = true;

        const deityData = {
            radha: { name: "Radha Radha", mantra: "Radhe Radhe Govind", color: "#FF69B4", bg: "radial-gradient(circle, #4a0024 0%, #000 100%)" },
            ram: { name: "Jai Shree Ram", mantra: "Ram Siya Ram", color: "#FF8C00", bg: "radial-gradient(circle, #4d2600 0%, #000 100%)" },
            shiva: { name: "Om Namah Shivay", mantra: "Om Namah Shivaya", color: "#00BFFF", bg: "radial-gradient(circle, #001a33 0%, #000 100%)" },
            navkar: { name: "Navkar Mantra", mantra: "Namo Arihantanam", color: "#FFD700", bg: "radial-gradient(circle, #332b00 0%, #000 100%)" }
        };

        function toggleSound() {
            isSoundOn = !isSoundOn;
            document.getElementById('soundBtn').innerText = isSoundOn ? '🔊' : '🔇';
        }

        function selectDeity(key) {
            const d = deityData[key];
            document.documentElement.style.setProperty('--primary-color', d.color);
            document.documentElement.style.setProperty('--bg-gradient', d.bg);
            document.getElementById('appTitle').innerText = d.name;
            document.getElementById('activeMantra').innerText = `"${d.mantra}"`;
            count = 0; malas = 0; updateDisplay();
            document.getElementById('mainMenu').classList.remove('active');
            document.getElementById('japScreen').classList.add('active');
        }

        function handleJap() {
            // Sound Signal
            if (isSoundOn && window.AppInventor) {
                window.AppInventor.setWebViewString("PLAY_SOUND");
            }
            
            count++;
            if (count >= 108) {
                count = 0; malas++;
                // Ad Signal
                if (window.AppInventor) window.AppInventor.setWebViewString("SHOW_AD");
            }
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('displayCount').innerText = count;
            document.getElementById('malaDisplay').innerText = `Malas Completed: ${malas}`;
        }

        function goBack() {
            document.getElementById('japScreen').classList.remove('active');
            document.getElementById('mainMenu').classList.add('active');
        }
    </script>
</body>
</html>
