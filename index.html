<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divine Jaap Pro</title>
    <style>
        :root {
            --primary-color: #FFD700;
            --bg-gradient: radial-gradient(circle, #333 0%, #000 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: var(--bg-gradient);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.5s ease;
        }

        .header {
            padding: 20px;
            text-align: center;
            background: rgba(0,0,0,0.6);
            border-bottom: 2px solid var(--primary-color);
            backdrop-filter: blur(10px);
        }

        .header h1 { color: var(--primary-color); font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }

        .screen { display: none; padding: 20px; animation: fadeIn 0.4s ease; flex-grow: 1; }
        .screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

        @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

        /* Menu Grid */
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 400px; }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 30px 10px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .card:active { transform: scale(0.95); background: rgba(255,255,255,0.2); }
        .card h2 { font-size: 40px; margin-bottom: 10px; }
        .card p { font-weight: bold; font-size: 16px; color: #fff; }

        /* Jaap UI */
        .mantra-text { font-size: 22px; margin-bottom: 20px; font-style: italic; color: #ccc; text-align: center; min-height: 60px; }
        
        .counter-circle {
            width: 240px; height: 240px;
            border: 8px solid var(--primary-color);
            border-radius: 50%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            box-shadow: 0 0 30px var(--primary-color);
            background: rgba(0,0,0,0.5);
            cursor: pointer;
            user-select: none;
            margin-bottom: 20px;
        }
        .counter-circle:active { transform: scale(0.92); }
        .count-num { font-size: 70px; color: white; font-weight: bold; }

        .mala-count { color: var(--primary-color); font-weight: bold; font-size: 22px; margin-bottom: 30px; }

        .btn-back {
            background: transparent; color: white; border: 1px solid white;
            padding: 12px 30px; border-radius: 50px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="appTitle">Divine Jaap Pro</h1>
    </div>

    <div class="screen active" id="mainMenu">
        <div class="menu-grid">
            <div class="card" onclick="selectDeity('radha')"><h2>🌸</h2><p>Radha Radha</p></div>
            <div class="card" onclick="selectDeity('ram')"><h2>🏹</h2><p>Jai Shree Ram</p></div>
            <div class="card" onclick="selectDeity('shiva')"><h2>🔱</h2><p>Om Namah Shivay</p></div>
            <div class="card" onclick="selectDeity('navkar')"><h2>🕉️</h2><p>Navkar Mantra</p></div>
        </div>
    </div>

    <div class="screen" id="japScreen">
        <p class="mantra-text" id="activeMantra">Mantra here...</p>
        
        <div class="counter-circle" onclick="handleJap()">
            <div class="count-num" id="displayCount">0</div>
            <p style="color: #bbb; font-size: 12px;">TAP TO JAAP</p>
        </div>
        
        <div class="mala-count" id="malaDisplay">Malas: 0</div>

        <button class="btn-back" onclick="goBack()">← BACK TO MENU</button>
    </div>

    <script>
        const deityData = {
            radha: { name: "Radha Radha", mantra: "Radhe Radhe Govind, Radhe Radhe!", color: "#FF69B4", bg: "radial-gradient(circle, #4a0024 0%, #000 100%)" },
            ram: { name: "Jai Shree Ram", mantra: "Ram Siya Ram, Siya Ram Jai Jai Ram", color: "#FF8C00", bg: "radial-gradient(circle, #4d2600 0%, #000 100%)" },
            shiva: { name: "Om Namah Shivay", mantra: "Om Namah Shivaya", color: "#00BFFF", bg: "radial-gradient(circle, #001a33 0%, #000 100%)" },
            navkar: { name: "Navkar Mantra", mantra: "Namo Arihantanam, Namo Siddhanam", color: "#FFD700", bg: "radial-gradient(circle, #332b00 0%, #000 100%)" }
        };

        let currentDeity = null;
        let count = 0;
        let malas = 0;

        function selectDeity(key) {
            currentDeity = key;
            const data = deityData[key];
            
            // Theme Apply
            document.documentElement.style.setProperty('--primary-color', data.color);
            document.documentElement.style.setProperty('--bg-gradient', data.bg);
            document.getElementById('appTitle').innerText = data.name;
            document.getElementById('activeMantra').innerText = `"${data.mantra}"`;
            
            count = 0;
            malas = 0;
            updateDisplay();
            
            document.getElementById('mainMenu').classList.remove('active');
            document.getElementById('japScreen').classList.add('active');
        }

        function handleJap() {
            count++;
            
            // 1 Mala = 108 Counts
            if (count >= 108) {
                count = 0;
                malas++;
                
                // 🟢 MIT APP INVENTOR BRIDGE: Signal for Interstitial Ad
                if (window.AppInventor) {
                    window.AppInventor.setWebViewString("SHOW_AD");
                }
            }
            
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('displayCount').innerText = count;
            document.getElementById('malaDisplay').innerText = `Malas Completed: ${malas}`;
        }

        function goBack() {
            // Reset Theme to Default
            document.documentElement.style.setProperty('--primary-color', '#FFD700');
            document.documentElement.style.setProperty('--bg-gradient', 'radial-gradient(circle, #333 0%, #000 100%)');
            document.getElementById('appTitle').innerText = 'Divine Jaap Pro';
            
            document.getElementById('japScreen').classList.remove('active');
            document.getElementById('mainMenu').classList.add('active');
        }
    </script>
</body>
</html>
