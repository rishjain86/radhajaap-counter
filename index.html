<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radha Krishna Jap - Rishit</title>
    <style>
        /* CSS remains same as previous version - Keeping it clean and English */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #FEFCE8 0%, #FFFBEB 100%); min-height: 100vh; overflow-y: auto; }
        body.dark-mode { background: #1a1a2e; color: white; }
        .header { background: linear-gradient(135deg, #D97706, #F59E0B); color: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; text-align: center; }
        .screen { display: none; padding: 20px; padding-bottom: 70px; } /* Space for Banner */
        .screen.active { display: block; }
        .menu-btn { width: 100%; background: linear-gradient(135deg, #D97706, #F59E0B); color: white; border: none; padding: 18px; border-radius: 15px; font-size: 18px; font-weight: bold; margin-bottom: 15px; cursor: pointer; display: flex; align-items: center; gap: 15px; }
        .content-box { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 2px solid #F59E0B; }
        body.dark-mode .content-box { background: #2d3748; border-color: #4a5568; }
        .jap-counter-container { background: linear-gradient(135deg, #8B5CF6, #A78BFA); border-radius: 20px; padding: 25px; text-align: center; color: white; }
        .counter-display { font-size: 4rem; font-weight: bold; margin: 15px 0; }
        .increment-btn { width: 100%; background: #10B981; color: white; border: none; padding: 20px; border-radius: 15px; font-size: 22px; font-weight: bold; cursor: pointer; }
        .notification { position: fixed; top: 20px; right: 20px; background: #10B981; color: white; padding: 12px; border-radius: 10px; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <div class="splash-screen" id="splashScreen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#F59E0B; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10000; color:white;">
        <h1 style="font-size:32px;">Jai Shree Krishna</h1>
        <p>Loading Devotional Experience...</p>
    </div>

    <div class="screen active" id="mainMenu" style="display:none;">
        <div class="header">
            <h2>Jai Shree Krishna</h2>
            <p>Radha Jap Counter</p>
        </div>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="showBhajan()">🎵 Bhajan Collection</button>
            <button class="menu-btn" onclick="showJap()">📿 Jap Counter</button>
            <button class="menu-btn" onclick="showScreen('settings')">⚙️ Settings</button>
        </div>
    </div>

    <div class="screen" id="japScreen">
        <button onclick="showScreen('mainMenu')" style="margin-bottom:10px; padding:8px;">← Back</button>
        <div class="jap-counter-container">
            <div class="counter-display" id="japCount">0</div>
            <p style="margin-bottom:20px; font-weight:bold;">Om Radhe Radhe</p>
            <button class="increment-btn" onclick="incrementJap()">Count Jap</button>
        </div>
    </div>

    <div id="banner-ad-container" style="position:fixed; bottom:0; left:0; width:100%; height:50px; background:#eee; display:none; align-items:center; justify-content:center; font-size:12px; color:#666;">
        Banner Ad Placeholder
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // AD CONFIGURATION
        const AD_UNITS = {
            INTERSTITIAL: 'ca-app-pub-6519206650027176/7837770216',
            BANNER: 'ca-app-pub-6519206650027176/5330315933'
        };

        let japCount = 0;

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splashScreen').style.display = 'none';
                document.getElementById('mainMenu').style.display = 'block';
                initAds();
            }, 3000);
        };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
        }

        // Add Interstitial Ad when moving to Jap/Bhajan
        function showJap() {
            showInterstitial();
            showScreen('japScreen');
        }

        function incrementJap() {
            japCount++;
            document.getElementById('japCount').innerText = japCount;
            if(navigator.vibrate) navigator.vibrate(50);
            
            // Show ad every 108 counts
            if(japCount % 108 === 0) {
                showInterstitial();
            }
        }

        // ADS LOGIC (Mockup for Cordova/Capacitor AdMob Plus)
        function initAds() {
            console.log("Ads Initialized");
            // Logic to show Banner
            const banner = document.getElementById('banner-ad-container');
            banner.style.display = 'flex'; 
            
            // If using a plugin:
            // admob.banner.show({ id: AD_UNITS.BANNER });
        }

        function showInterstitial() {
            console.log("Loading Interstitial: " + AD_UNITS.INTERSTITIAL);
            // If using a plugin:
            /*
            admob.interstitial.load({ id: AD_UNITS.INTERSTITIAL }).then(() => {
                admob.interstitial.show();
            });
            */
            showNotification("Loading Blissful Ad...");
        }

        function showNotification(msg) {
            const n = document.getElementById('notification');
            n.innerText = msg;
            n.style.display = 'block';
            setTimeout(() => n.style.display = 'none', 2000);
        }
    </script>
</body>
</html>
