<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radha Krishna Divine</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --deep-orange: #FF8C00;
            --glass: rgba(255, 255, 255, 0.15);
            --text-gold: #FFD700;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: radial-gradient(circle, #2c0101 0%, #000000 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background Sparkles */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            opacity: 0.3;
            z-index: -1;
        }

        /* Premium Header */
        .header {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(255, 140, 0, 0.2), transparent);
            border-bottom: 1px solid var(--primary-gold);
        }

        .header h1 {
            font-size: 28px;
            letter-spacing: 2px;
            color: var(--text-gold);
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            text-transform: uppercase;
        }

        /* Screen Container */
        .screen {
            display: none;
            padding: 20px;
            animation: fadeIn 0.5s ease-in;
        }

        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Dhinchak Menu Cards */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .menu-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 25px 15px;
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .menu-card:active { transform: scale(0.9); border-color: var(--primary-gold); }

        .menu-card i {
            font-size: 30px;
            display: block;
            margin-bottom: 10px;
        }

        /* Counter UI - The Main Attraction */
        .counter-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--primary-gold);
            border-radius: 50%;
            width: 250px;
            height: 250px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 140, 0, 0.4);
            position: relative;
        }

        .counter-display {
            font-size: 60px;
            font-weight: bold;
            color: var(--primary-gold);
        }

        .btn-jap {
            background: linear-gradient(45deg, #FF8C00, #FFD700);
            border: none;
            width: 100%;
            padding: 20px;
            border-radius: 50px;
            color: #000;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(255, 140, 0, 0.4);
            cursor: pointer;
        }

        /* Ads Space */
        .banner-ad {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #111;
            border-top: 1px solid var(--primary-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #444;
        }

        /* Utility */
        .back-btn {
            color: var(--primary-gold);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Divine Radha</h1>
    </div>

    <div class="screen active" id="mainMenu">
        <div class="menu-grid">
            <div class="menu-card" onclick="startJap()">
                <span>📿</span>
                <p>Start Jap</p>
            </div>
            <div class="menu-card" onclick="showScreen('bhajan')">
                <span>🎵</span>
                <p>Bhajans</p>
            </div>
            <div class="menu-card" onclick="showScreen('stats')">
                <span>📊</span>
                <p>History</p>
            </div>
            <div class="menu-card" onclick="showScreen('settings')">
                <span>⚙️</span>
                <p>Settings</p>
            </div>
        </div>
    </div>

    <div class="screen" id="japScreen">
        <a href="#" class="back-btn" onclick="showScreen('mainMenu')">← EXIT TO MENU</a>
        <div class="counter-box">
            <p style="font-size: 12px; color: var(--primary-gold);">COUNT</p>
            <div class="counter-display" id="japCount">0</div>
            <p style="font-size: 14px; margin-top: 5px;">Radhe Radhe</p>
        </div>
        <button class="btn-jap" onclick="incrementJap()">Press to Jap</button>
        <p style="text-align: center; margin-top: 20px; color: #888;">Target: 108</p>
    </div>

    <div class="screen" id="bhajanScreen">
        <a href="#" class="back-btn" onclick="showScreen('mainMenu')">← BACK</a>
        <h2 style="color: var(--primary-gold); margin-bottom: 15px;">Sacred List</h2>
        <div class="menu-card" style="width: 100%; margin-bottom: 10px; text-align: left;">
            🎵 Shree Krishna Govind...
        </div>
        <div class="menu-card" style="width: 100%; text-align: left;">
            🎵 Radhe Radhe Barsane...
        </div>
    </div>

    <div class="banner-ad">
        AD SPACE : ca-app-pub-6519206650027176/5330315933
    </div>

    <script>
        const INTERSTITIAL_ID = 'ca-app-pub-6519206650027176/7837770216';
        let count = 0;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startJap() {
            // Interstitial Ad Trigger logic can go here
            console.log("Loading Ad: " + INTERSTITIAL_ID);
            showScreen('japScreen');
        }

        function incrementJap() {
            count++;
            document.getElementById('japCount').innerText = count;
            
            // Haptic Feedback
            if (navigator.vibrate) navigator.vibrate(60);

            // Ad on 108
            if (count % 108 === 0) {
                alert("Mala Complete! Showing Ad...");
            }
        }
    </script>
</body>
</html>
